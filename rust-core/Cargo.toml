[package]
name = "coolapk_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Coolapk API core and UniFFI bindings for coolapk-kmp"

[lib]
name = "coolapk_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bcrypt = "0.15"
chrono = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "multipart", "rustls-tls-webpki-roots", "stream", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uniffi = { version = "0.29.4", features = ["tokio"] }

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_vendor = "apple")'.dependencies]
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
