name: 手动打包 APK

# 仅通过 Actions 页面手动触发，不随提交或 PR 自动运行。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型：debug（默认签名，可直接安装）或 release（未签名，需自行签名）"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: 构建 ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 NDK ${{ env.ANDROID_NDK_VERSION }}
        # Ubuntu 运行器已预装 Android SDK，这里只补装指定版本的 NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 安装 Rust 与 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: 还原发布签名密钥库
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 编译 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew :androidApp:assembleRelease
          else
            ./gradlew :androidApp:assembleDebug
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-kmp-${{ inputs.build_type }}
          path: androidApp/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14
